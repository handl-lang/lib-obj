[package]
name = "handl-lib-obj"
version = "0.1.0"
edition = "2024"
description = "obj: Handl stdlib port (ADR-0128 split)."
license = "MIT"
repository = "https://github.com/handl-lang/lib-obj"
homepage = "https://github.com/handl-lang/lib-obj"
readme = "README.md"

[dependencies]
handl-lib-ops = { git = "https://github.com/handl-lang/kernel", branch = "main" }
handl-ops = { git = "https://github.com/handl-lang/kernel", branch = "main" }
serde_json = "1"

[patch."https://github.com/handl-lang/kernel"]
handl-ops = { path = "../kernel/crates/handl-ops" }
handl-lib-ops = { path = "../kernel/crates/ops" }
